name: Hämta menyer
on:
  # Körningarna startas utifrån av cron-job.org, som anropar workflow_dispatch
  # kl 08:47 varje dag samt 10:23 och 12:23 på vardagar, svensk tid. GitHubs eget
  # schema används inte: det startade körningarna fem till åtta timmar för sent i
  # det här repot, och togs bort i oktober 2026 när det gick igång sex gånger en kväll.
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hämta menyer
        run: python -m scraper
      - name: Bygg sidan
        run: python -m scraper.build
      - name: Committa om något ändrats
        run: |
          git config user.name "lunch-bot"
          git config user.email "lunch-bot@users.noreply.github.com"
          git add data/menus.json docs/index.html
          if git diff --cached --quiet; then
            echo "Inga ändringar"
          else
            git commit -m "Uppdatera menyer $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
      - name: Hälsokoll
        # Öppnar ett ärende om en restaurang har misslyckats i ungefär två dagar,
        # och stänger det när den fungerar igen. GitHub mejlar ägaren om nya ärenden.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/halsokoll.py
