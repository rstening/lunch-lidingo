name: Hämta menyer
on:
  schedule:
    # GitHub räknar i UTC, så varje svensk tid behöver en rad för sommartid och en för vintertid.
    - cron: "0 7 * * *"      # 09:00 svensk sommartid, alla dagar
    - cron: "0 8 * * *"      # 09:00 svensk vintertid, alla dagar
    # Extra körningar på vardagar: Brasserie Jernet lägger in dagens rätt mellan ca 09:20 och 12:10.
    - cron: "30 8 * * 1-5"   # 10:30 svensk sommartid
    - cron: "30 9 * * 1-5"   # 10:30 svensk vintertid
    - cron: "0 10 * * 1-5"   # 12:00 svensk sommartid
    - cron: "0 11 * * 1-5"   # 12:00 svensk vintertid
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hämta menyer
        run: python -m scraper
      - name: Bygg sidan
        run: python -m scraper.build
      - name: Committa om något ändrats
        run: |
          git config user.name "lunch-bot"
          git config user.email "lunch-bot@users.noreply.github.com"
          git add data/menus.json docs/index.html
          if git diff --cached --quiet; then
            echo "Inga ändringar"
          else
            git commit -m "Uppdatera menyer $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
