name: Hämta menyer
on:
  schedule:
    # GitHub räknar i UTC, så varje svensk tid behöver en rad för sommartid och en för vintertid.
    # Tiderna ligger medvetet inte på hel eller halv timme: då är kön hos GitHub som längst,
    # och schemalagda jobb har startat flera timmar för sent.
    - cron: "47 6 * * *"     # 08:47 svensk sommartid, alla dagar
    - cron: "47 7 * * *"     # 08:47 svensk vintertid, alla dagar
    # Extra körningar på vardagar: Brasserie Jernet lägger in dagens rätt mellan ca 09:20 och 12:10.
    - cron: "23 8 * * 1-5"   # 10:23 svensk sommartid
    - cron: "23 9 * * 1-5"   # 10:23 svensk vintertid
    - cron: "17 10 * * 1-5"  # 12:17 svensk sommartid
    - cron: "17 11 * * 1-5"  # 12:17 svensk vintertid
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hämta menyer
        run: python -m scraper
      - name: Bygg sidan
        run: python -m scraper.build
      - name: Committa om något ändrats
        run: |
          git config user.name "lunch-bot"
          git config user.email "lunch-bot@users.noreply.github.com"
          git add data/menus.json docs/index.html
          if git diff --cached --quiet; then
            echo "Inga ändringar"
          else
            git commit -m "Uppdatera menyer $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
      - name: Hälsokoll
        # Öppnar ett ärende om en restaurang har misslyckats i ungefär två dagar,
        # och stänger det när den fungerar igen. GitHub mejlar ägaren om nya ärenden.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/halsokoll.py
